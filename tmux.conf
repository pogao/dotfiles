set -g default-terminal "${TERM}"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position bottom    # zellij style, key hints on the last line
set -g mouse on
setw -g mode-keys vi

# Plugin declarations
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Continuum settings
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'ghostty,fullscreen'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Catppuccin v2 config (must be set before loading the theme)
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #W#{E:@agent_window_flag}"
set -g @catppuccin_window_current_text " #W#{E:@agent_window_flag}"
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_directory_text "#{pane_current_path}"

# Load catppuccin theme (must come before status-right, after config options)
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# Status line (must come after catppuccin loads so module variables exist)
set -g status-left ""
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_host}"

# >>> start directories
# A new window starts in $HOME. A new pane starts where the active pane is.
bind c new-window -c "$HOME"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind * new-pane -c "#{pane_current_path}"
# <<< start directories

# >>> help bar
# A second status line of zellij-style key hints. It follows the active key
# table, so pressing the prefix or entering copy mode swaps the hints.
%hidden K="#[fg=#{@thm_fg},bg=#{@thm_surface_1},bold]"
%hidden L="#[fg=#{@thm_subtext_0},bg=default,nobold]"
set -g @hints_root "#[fg=#{@thm_crust},bg=#{@thm_green},bold] NORMAL $L  $K C-h/j/k/l $L move  $K C-b $L prefix, then  $K c $L new window  $K %% $L split →  $K \" $L split ↓  $K S $L stack  $K z $L zoom  $K x $L close  $K a $L next agent  $K [ $L scroll"
set -g @hints_prefix "#[fg=#{@thm_crust},bg=#{@thm_peach},bold] PREFIX $L  $K c $L new window  $K , $L rename  $K n/p $L next/prev  $K 1-9 $L go to  $K %% $L split →  $K \" $L split ↓  $K x $L close pane  $K z $L zoom  $K S $L stack  $K * $L float  $K ! $L pane to window  $K Space $L layout  $K { } $L swap  $K a $L next agent  $K w $L tree  $K s $L sessions  $K d $L detach  $K C-s $L save  $K C-r $L restore  $K \\ $L menu  $K ? $L all keys"
set -g @hints_copy "#[fg=#{@thm_crust},bg=#{@thm_yellow},bold] COPY $L  $K h/j/k/l $L move  $K Space $L select  $K v $L block  $K y $L yank  $K / ? $L search  $K n/N $L next/prev  $K q $L exit"
set -g status 2
set -g status-format[1] "#[align=left]#{?client_prefix,#{E:@hints_prefix},#{?pane_in_mode,#{E:@hints_copy},#{E:@hints_root}}}"
# <<< help bar

# >>> stacked panes
# With @stack on, the active pane fills its column and the other panes in that
# column shrink to their title bar, like zellij's stacked panes. Walk the stack
# with C-j / C-k (vim-tmux-navigator) or click a title bar.
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#{@thm_lavender}#,bold],#[fg=#{@thm_overlay_1}]} #{pane_index} #{pane_current_command}#{?pane_title, · #{=40:pane_title},} #[nobold]#{E:@agent_pane_flag} "
set-hook -g window-pane-changed[10] 'if -F "#{&&:#{@stack},#{!:#{window_zoomed_flag}}}" "resize-pane -y 100%"'
bind S if -F '#{@stack}' 'set -wu @stack ; select-layout -E ; display "stack off"' 'set -w @stack 1 ; resize-pane -y 100% ; display "stack on"'
# <<< stacked panes

# >>> agent attention
# Agent hooks call ~/.tmux/bin/agent-state to set @agent_state on their pane
# (waiting = needs input, done = finished its turn). Looking at the pane clears it.
set -g @agent_pane_flag "#{?#{==:#{@agent_state},waiting},#[fg=#{@thm_red}]󰂞 needs input,#{?#{==:#{@agent_state},done},#[fg=#{@thm_green}]󰄬 done,}}"
set -g @agent_window_flag "#{?#{P:#{?#{==:#{@agent_state},waiting},1,}},#[fg=#{@thm_red}] 󰂞,#{?#{P:#{?#{==:#{@agent_state},done},1,}},#[fg=#{@thm_green}] 󰄬,}}"
set-hook -g window-pane-changed[20] 'if -F "#{&&:#{window_active},#{session_attached}}" "set -pu @agent_state"'
set-hook -g session-window-changed[20] 'if -F "#{session_attached}" "set -pu @agent_state"'
set-hook -g client-session-changed[20] 'set -pu @agent_state'
bind a run -b '~/.tmux/bin/agent-state jump "#{client_name}"'
# <<< agent attention

# Initialize TPM (must be last)
run '~/.tmux/plugins/tpm/tpm'
